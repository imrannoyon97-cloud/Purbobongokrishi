<script>


/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://dvipyiszjnnnohynfkor.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_uTjl3A6mVHDr5jK0659QbQ_eWtYajMG";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


let user = null;

let goats = [];

let schedules = [];

let vaccinations = [];

let expenses = [];


/* =====================================================
HELPERS
===================================================== */

function esc(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m];

}
);

}


function money(number){

return "৳ " +
Number(number || 0)
.toLocaleString(
"en-IN",
{
maximumFractionDigits:2
}
);

}


function today(){

return new Date()
.toISOString()
.slice(0,10);

}


function dateBn(date){

if(!date)
return "—";

const d =
new Date(
date + "T00:00:00"
);

return d.toLocaleDateString("en-GB");

}


function ageText(birth){

if(!birth)
return "বয়স নেই";

const b =
new Date(
birth + "T00:00:00"
);

const n =
new Date();

let years =
n.getFullYear() -
b.getFullYear();

let months =
n.getMonth() -
b.getMonth();

let days =
n.getDate() -
b.getDate();

if(days < 0){
months--;
}

if(months < 0){

years--;

months += 12;

}

if(years < 0)
return "বয়স ভুল";

return (
years +
" বছর " +
months +
" মাস"
);

}


function daysFromToday(date){

const a =
new Date(
today() +
"T00:00:00"
);

const b =
new Date(
date +
"T00:00:00"
);

return Math.round(
(b-a)/86400000
);

}


function dueLabel(date){

const d =
daysFromToday(date);

if(d === 0)
return "আজ";

if(d > 0)
return "আর " + d + " দিন";

return Math.abs(d) + " দিন আগে";

}


function toast(message){

const t =
document.getElementById("toast");

t.textContent = message;

t.classList.add("show");

setTimeout(
()=>{
t.classList.remove("show");
},
2800
);

}


function openModal(html){

document.getElementById("modal")
.innerHTML = html;

document
.getElementById("modalBackdrop")
.classList
.add("show");

}


function closeModal(){

document
.getElementById("modalBackdrop")
.classList
.remove("show");

}


/* =====================================================
SECTION
===================================================== */

function showSection(section){

const sections = [
"goats",
"vaccines",
"expenses",
"report"
];


sections.forEach(
x=>{

document
.getElementById(
x + "Section"
)
.classList
.toggle(
"hidden",
x !== section
);

const nav =
document.getElementById(
"nav" +
x.charAt(0).toUpperCase() +
x.slice(1)
);

if(nav){

nav.classList
.toggle(
"active",
x === section
);

}

}
);


if(section === "vaccines")
renderVaccines();

if(section === "report")
renderReport();

}


/* =====================================================
AUTH
===================================================== */

async function login(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

if(!email || !password){

alert(
"ইমেইল ও পাসওয়ার্ড দিন।"
);

return;

}


const {error} =
await sb.auth.signInWithPassword({
email,
password
});


if(error){

alert(error.message);

}

}


async function signup(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;


if(!email || !password){

alert(
"ইমেইল ও পাসওয়ার্ড দিন।"
);

return;

}


if(password.length < 6){

alert(
"পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।"
);

return;

}


const {error} =
await sb.auth.signUp({
email,
password
});


if(error){

alert(error.message);

return;

}


alert(
"অ্যাকাউন্ট তৈরি হয়েছে। Email verification চালু থাকলে আগে email verify করুন।"
);

}


async function logout(){

await sb.auth.signOut();

}


/* =====================================================
AUTH STATE
===================================================== */

sb.auth.onAuthStateChange(
async(_event, session)=>{

user =
session?.user || null;


document
.getElementById("loginView")
.classList
.toggle(
"hidden",
!!user
);


document
.getElementById("appView")
.classList
.toggle(
"hidden",
!user
);


if(user){

document
.getElementById("expenseDate")
.value =
today();

document
.getElementById("reportMonth")
.value =
today().slice(0,7);

await loadAll();

}

}
);


/* =====================================================
LOAD DATABASE
===================================================== */

async function loadAll(){

await Promise.all([

loadGoats(),

loadSchedules(),

loadVaccinations(),

loadExpenses()

]);


populateGoatSelect();

renderGoats();

updateNoticeCount();

renderReport();

}


async function loadGoats(){

const {data,error} =
await sb
.from("goats")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

alert(error.message);

return;

}


goats =
data || [];

}


async function loadSchedules(){

const {data,error} =
await sb
.from("vaccination_schedules")
.select("*")
.order("due_date");


if(error){

console.error(error);

alert(error.message);

return;

}


schedules =
data || [];

}


async function loadVaccinations(){

const {data,error} =
await sb
.from("vaccinations")
.select("*")
.order(
"vaccination_date",
{
ascending:false
}
);


if(error){

console.error(error);

alert(error.message);

return;

}


vaccinations =
data || [];

}


async function loadExpenses(){

const {data,error} =
await sb
.from("expenses")
.select("*")
.order(
"expense_date",
{
ascending:false
}
);


if(error){

console.error(error);

alert(error.message);

return;

}


expenses =

}


/* =====================================================
GOAT EXPENSE / PROFIT
===================================================== */

function goatExpenses(id){

return expenses
.filter(
e=>e.goat_id === id
)
.reduce(
(total,e)=>
total +
Number(e.amount || 0),
0
);

}


function goatProfit(goat){

if(
goat.sale_price === null ||
goat.sale_price === undefined
){

return null;

}


return (
Number(goat.sale_price || 0)
-
Number(goat.purchase_price || 0)
-
goatExpenses(goat.id)
);

}

);

document
.getElementById("vCost")
.value || 0
);

await sb
.from("vaccinations")
.insert({

user_id:
user.id,

goat_id:
schedule.goat_id,

vaccine_name:
schedule.vaccine_name,

company,

vaccination_date:
date,

cost,

notes:
document
.getElementById("vNote")
.value
.trim() || null

});


if(error){

.from("vaccination_schedules")
.update({

})

schedule.id
);

.from("expenses")
.insert({

user_id:
user.id,

goat_id:
schedule.goat_id,

category:
"টিকা",

quantity:
1,

unit:
"ডোজ",

amount:
cost,

expense_date:
date,

description:
schedule.vaccine_name +
" - " +
company

});


if(expenseError){

console.error(
expenseError
);

}

}


closeModal();

await loadAll();

toast(

}
